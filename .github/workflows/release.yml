name: Release（打 tag 自动编译发布）

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bom-procurement-windows
            separator: ";"
          - os: macos-latest
            artifact: bom-procurement-macos
            separator: ":"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 跑一遍测试（防止发出坏包）
        run: python -m pytest server/tests -q

      - name: PyInstaller 打包（单文件可执行）
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name bom-procurement \
            --add-data "server/webui${{ matrix.separator }}server/webui" \
            --add-data "scripts/ocr_vision.swift${{ matrix.separator }}scripts" \
            --collect-all fastmcp --collect-all uvicorn --collect-all pymupdf \
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            launcher.py

      - name: ad-hoc 签名（仅 macOS，消除「已损坏」误导提示）
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/bom-procurement

      - name: 冒烟测试打包产物（启动→健康检查→退出）
        shell: bash
        run: |
          set -e
          BIN=dist/bom-procurement
          if [ -f dist/bom-procurement.exe ]; then BIN=dist/bom-procurement.exe; fi
          export PROC_PORT=8765
          export PROC_DATA_DIR="${RUNNER_TEMP}/procdata"
          "$BIN" > smoke.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 45); do
            sleep 1
            if curl -sf http://127.0.0.1:8765/api/health >/dev/null 2>&1; then ok=1; break; fi
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "❌ 打包产物未通过健康检查，进程输出："
            cat smoke.log
            exit 1
          fi
          echo "✅ 打包产物健康检查通过"
          head -6 smoke.log

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/bom-procurement
            dist/bom-procurement.exe
          if-no-files-found: ignore

  package-skill:
    name: 打包 Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 归档 skill 包（zip 与 .skill 双份，内容相同）
        run: |
          mkdir -p out
          # skill 包 = SKILL.md + 安装/启动脚本 + 完整源码（供 install.py 布署）
          rsync -a --exclude '.git' --exclude '.venv' --exclude '__pycache__' \
                --exclude '.pytest_cache' --exclude 'dist' --exclude 'build' \
                ./ out/bom-procurement/
          cd out
          # .zip 供人手动解压（双击即可）；.skill 供 OneAgent 技能系统安装
          zip -qr bom-procurement.zip bom-procurement
          cp bom-procurement.zip bom-procurement.skill
      - uses: actions/upload-artifact@v4
        with:
          name: bom-procurement-skill
          path: |
            out/bom-procurement.zip
            out/bom-procurement.skill

  release:
    name: 发布到 Release
    needs: [build, package-skill]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打 tag 时创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            ## 安装

            ### Windows
            1. 下载 `bom-procurement.exe`，双击运行（首次可能提示 SmartScreen → 更多信息 → 仍要运行）
            2. 浏览器自动打开 `http://127.0.0.1:8000`，接口口令在窗口里打印

            ### macOS（未签名，自用）
            因未做 Apple 签名，首次运行会被 Gatekeeper 拦截，**这不是文件损坏**。放行命令：

            ```bash
            cd ~/Downloads
            chmod +x bom-procurement
            xattr -d com.apple.quarantine bom-procurement
            ./bom-procurement
            ```

            若系统设置里找不到「仍要打开」入口（macOS 15+ 常见），务必用上面的命令方式。
            完整说明（四种方式 + 常见报错处理）：[docs/install-macos.md](https://github.com/xufei8738-max/bom-procurement/blob/main/docs/install-macos.md)

            也可**源码安装**（完全不触发 Gatekeeper，推荐）：
            ```bash
            git clone https://github.com/xufei8738-max/bom-procurement.git
            cd bom-procurement && bash install.sh
            ```

            ### 源码/Skill 安装
            1. 下载 `bom-procurement.zip`（双击解压；**注意 `.skill` 后缀文件也是 zip**，
               双击解不开时改名为 .zip 或用 `unzip bom-procurement.skill`）
            2. 解压后进入目录执行 `bash install.sh`（Windows: `install.bat`）
            3. 安装器最后会打印 **MCP 配置参数（URL 和口令）**，照着填进 OneAgent 即可

            📖 完整步骤（OneAgent MCP 逐项配置 + Skill 三种安装方式 + 排错表）：
            [docs/oneagent-setup.md](https://github.com/xufei8738-max/bom-procurement/blob/main/docs/oneagent-setup.md)

            ### OneAgent 对接（MCP）
            在 OneAgent 的 设置 → MCP 服务器管理 添加：
            - 传输方式：`http`
            - URL：`http://127.0.0.1:8000/mcp`（**结尾 /mcp 不能漏**）
            - Header：键 `Authorization`，值 `Bearer 你的口令`（**Bearer 后有一个空格**）
            - 口令见启动时终端输出，或数据目录 `接口口令.txt`
            - 成功标志：工具列表出现 19 个工具
          files: |
            artifacts/bom-procurement-windows/bom-procurement.exe
            artifacts/bom-procurement-macos/bom-procurement
            artifacts/bom-procurement-skill/bom-procurement.zip
            artifacts/bom-procurement-skill/bom-procurement.skill
